<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ajo Savings Tracker - Dashboard</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>

<body>

    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="dashboard-header">

        <div>

            <h1>Ajo Savings Tracker</h1>

            <p>
                Financial Overview
            </p>

        </div>

        <button
            id="refreshDashboard"
            type="button"
        >
            Refresh
        </button>

    </header>


    <!-- ======================================================
         MAIN DASHBOARD
    ======================================================= -->

    <main class="dashboard-container">


        <!-- ==================================================
             SUMMARY CARDS
        =================================================== -->

        <section class="summary-grid">

            <!-- TOTAL GROUPS -->

            <div class="summary-card">

                <h3>Total Groups</h3>

                <p id="totalGroups">
                    0
                </p>

            </div>


            <!-- TOTAL MEMBERS -->

            <div class="summary-card">

                <h3>Total Members</h3>

                <p id="totalMembers">
                    0
                </p>

            </div>


            <!-- TOTAL CONTRIBUTIONS -->

            <div class="summary-card">

                <h3>Total Contributions</h3>

                <p id="totalContributions">
                    ₦0
                </p>

            </div>


            <!-- TOTAL PAYOUTS -->

            <div class="summary-card">

                <h3>Total Payouts</h3>

                <p id="totalPayouts">
                    ₦0
                </p>

            </div>


            <!-- AVAILABLE BALANCE -->

            <div class="summary-card">

                <h3>Available Balance</h3>

                <p id="availableBalance">
                    ₦0
                </p>

            </div>


            <!-- PENDING PAYOUTS -->

            <div class="summary-card">

                <h3>Pending Payouts</h3>

                <p id="pendingPayouts">
                    ₦0
                </p>

            </div>

        </section>


        <!-- ==================================================
             AJO HEALTH
        =================================================== -->

        <section class="health-section">

            <h2>
                Ajo Cycle Health
            </h2>

            <div
                id="healthCard"
                class="health-card"
            >

                <h3 id="healthStatus">
                    Checking...
                </h3>

                <p id="healthMessage">
                    Please wait...
                </p>

            </div>

        </section>


        <!-- ==================================================
             UPCOMING PAYOUTS
        =================================================== -->

        <section class="upcoming-section">

            <div class="section-heading">

                <h2>
                    Upcoming Payouts
                </h2>

                <span id="pendingCount">
                    0 pending
                </span>

            </div>


            <div
                id="upcomingPayouts"
                class="payout-list"
            >

                <p>
                    Loading payout schedule...
                </p>

            </div>

        </section>


    </main>


    <!-- ======================================================
         DASHBOARD JAVASCRIPT
    ======================================================= -->

    <script src="js/dashboard.js"></script>

</body>

</html>
