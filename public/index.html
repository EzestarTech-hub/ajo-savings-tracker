<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajo Savings Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Ajo Savings Tracker</h1>

<form id="groupForm">

  <input
    type="text"
    id="name"
    placeholder="Group Name"
    required
  >

  <input
    type="number"
    id="amount"
    placeholder="Contribution Amount"
    required
  >

  <input
    type="text"
    id="frequency"
    placeholder="monthly"
    required
  >

  <input
    type="date"
    id="startDate"
    required
  >

  <button type="submit">
    Create Group
  </button>

</form>

<p id="message"></p>
<h2>Groups</h2>

<ul id="groupList"></ul>

<script src="js/app.js"></script>
</body>
</html>
