<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Details - Ajo Savings Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ======================================================
         PAGE HEADER
    ======================================================= -->

    <header>

        <h1 id="groupName">
            Loading...
        </h1>

        <a href="dashboard.html">
            Dashboard
        </a>

    </header>


    <main>


        <!-- ==================================================
             GROUP SUMMARY
        =================================================== -->

        <section>

            <h2>Group Summary</h2>


            <div class="card">

                <h3>
                    Members
                </h3>

                <p id="memberCount">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Total Contribution
                </h3>

                <p id="totalContribution">
                    ₦0
                </p>

            </div>

        </section>


        <!-- ==================================================
             AJO CYCLE / CONTRIBUTION OVERVIEW
        =================================================== -->

        <section
            id="cycleOverviewSection"
        >

            <h2>
                Ajo Cycle / Contribution Overview
            </h2>


            <div
                id="cycleOverview"
            >

                <p>
                    Loading cycle overview...
                </p>

            </div>

        </section>


        <!-- ==================================================
             MEMBERS
        =================================================== -->

        <section>

            <h2>
                Members
            </h2>


            <div
                id="memberList"
            >

                <p>
                    Loading members...
                </p>

            </div>


            <!-- Add Member -->

            <button
                id="addMember"
                type="button"
            >
                Add Member
            </button>


            <!-- Add Member Form -->

            <div
                id="memberForm"
                style="display: none;"
            >

                <h3>
                    Add Member
                </h3>


                <input
                    type="text"
                    id="memberName"
                    placeholder="Member Name"
                >


                <button
                    id="saveMember"
                    type="button"
                >
                    Save Member
                </button>

            </div>

        </section>


        <!-- ==================================================
             CONTRIBUTION FORM
        =================================================== -->

        <section
            id="contributionForm"
            style="display: none;"
        >

            <h2>
                Record Contribution
            </h2>


            <p id="selectedMember"></p>


            <input
                type="number"
                id="contributionAmount"
                placeholder="Amount"
                min="1"
            >


            <input
                type="date"
                id="paymentDate"
            >


            <button
                id="saveContribution"
                type="button"
            >
                Save Contribution
            </button>

        </section>


        <!-- ==================================================
             PAYOUT FORM
        =================================================== -->

        <section
            id="payoutForm"
            style="display: none;"
        >

            <h2>
                Record Payout
            </h2>


            <p id="selectedPayoutMember"></p>


            <input
                type="number"
                id="payoutAmount"
                placeholder="Payout Amount"
                min="1"
            >


            <input
                type="date"
                id="payoutDate"
            >


            <button
                id="savePayout"
                type="button"
            >
                Save Payout
            </button>

        </section>


        <!-- ==================================================
             PAYOUT SCHEDULE
        =================================================== -->

        <section>

            <div class="card">

                <h2>
                    Payout Schedule
                </h2>


                <!-- Add Schedule Button -->

                <button
                    id="addScheduleButton"
                    type="button"
                >
                    Add Payout Schedule
                </button>


                <!-- Schedule Form -->

                <div
                    id="scheduleForm"
                    style="display: none;"
                >

                    <h3>
                        Create Payout Schedule
                    </h3>


                    <label for="scheduleMember">
                        Member
                    </label>


                    <select
                        id="scheduleMember"
                    >

                        <option value="">
                            Select Member
                        </option>

                    </select>


                    <label for="scheduleAmount">
                        Amount
                    </label>


                    <input
                        type="number"
                        id="scheduleAmount"
                        placeholder="Payout Amount"
                        min="1"
                    >


                    <label for="scheduleDate">
                        Payout Date
                    </label>


                    <input
                        type="date"
                        id="scheduleDate"
                    >


                    <button
                        id="saveSchedule"
                        type="button"
                    >
                        Save Schedule
                    </button>

                </div>


                <!-- Schedule List -->

                <div
                    id="payoutScheduleList"
                >

                    <p>
                        Loading payout schedule...
                    </p>

                </div>

            </div>

        </section>


    </main>


    <!-- ======================================================
         GROUP JAVASCRIPT
    ======================================================= -->

    <script src="js/group.js"></script>

</body>

</html>
